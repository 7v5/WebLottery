<!DOCTYPE html>
<html>
    <head>
        <title>Lottery Game</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/css/uikit.min.css" />
        <link rel="stylesheet" href="css/styles.css"/>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/uikit@3.25.16/dist/js/uikit-icons.min.js"></script>
    </head>

    <body>
        <div class="page-wrapper">
            <div class="game-row">
                
                <div id="ticketContainer" class="card-container">
                    <fieldset class="uk-fieldset">
                        <legend class="uk-legend">Ticket Type</legend>
                        <div class="radio-group">
                            <label><input type="radio" class="uk-radio" name="ticketType" id="rdoSmall" checked> Basic Ticket $1 (3 Picks) 1-20</label>
                            <label><input type="radio" class="uk-radio" name="ticketType" id="rdoMedium"> Standard Ticket $3 (5 Picks) 1-50</label>
                            <label><input type="radio" class="uk-radio" name="ticketType" id="rdoMega"> Mega Ticket $5 (6 Picks) 1-60</label>
                        </div>
                    </fieldset>

                    <div style="padding-top: 20px;"> <label><input type="checkbox" class="uk-checkbox" id="chkPowerball"> PowerBall $2 (1 Pick) 1-10</label>
                    </div>
                </div>

                <div id="userPicks" class="card-container">
                    <legend class="uk-legend">Number Picks</legend>
                    <label><input type="text" class="uk-input" id="txtUserPicks" placeholder="Enter your picks"></label>
                    <label><input type="text" class="uk-input" id="txtPowerballPick" placeholder="Enter your Powerball pick" style="display: none;"></label>
                </div>

                <div id="instructions" class="card-container">
                    <legend class="uk-legend">Instructions</legend>
                    <span class="uk-text spacing-bottom">
                        Enter your picks<br>
                        ex. "1 2 3 4 5"<br>
                        Hit play!
                    </span>

                    <legend class="uk-legend">Powerball Instructions</legend>
                    <span class="uk-text">
                        Enter your guess<br>
                        If you get it right, you win $10
                    </span>
                </div>
            </div> 

            <div class="button-row">
                <button class="uk-button-primary uk-button uk-button-large" id="btnPlay">Let's Play!</button>
            </div>

            <div class="game-row">
                
                <div id="outcomeContainer" class="card-container card-container-center">
                    <legend class="uk-legend text-center">Outcome</legend>
                    <span class="uk-text text-center result-box" id="txtOutcome">Not Available Yet</span>
                </div>

                <div id="winningNumContainer" class="card-container card-container-center">
                    <legend class="uk-legend text-center">Winning Numbers</legend>
                    <span class="uk-text text-center result-box" id="txtWinningNumbers">Not Available Yet</span>
                </div>

                <div id="winningSummaryContainer" class="card-container">
                    <legend class="uk-legend text-center">Winning Summary</legend>

                    <div class="summary-wrapper">
                        <div id="summaryLabels" class="label-column">
                            <span class="uk-text">Total Spent:</span>
                            <span class="uk-text">Total Winnings:</span>
                            <span class="uk-text">Total Profit:</span>
                        </div>

                        <div id="summaryValues" class="value-column">
                            <span class="uk-text result-box" id="txtTotalSpent">$0</span>
                            <span class="uk-text result-box" id="txtTotalWinnings">$0</span>
                            <span class="uk-text result-box" id="txtNetProfit">$0</span>
                        </div>
                    </div>
                </div>
            </div>

        </div> 

        <script type="module" src="js/script.js"></script>
    </body>
</html>
